name: daily-short

on:
  schedule:
    - cron: "17 15 * * *"   # 10:17 ET (UTC-5) every day
  workflow_dispatch:
    inputs:
      slug:
        description: "Problem slug (blank = next in queue)"
        required: false
      upload:
        description: "Upload to YouTube (private; scheduled to go public tomorrow if PUBLISH_SCHEDULE=on and 'schedule' is ticked)"
        type: boolean
        default: true
      schedule:
        description: "Schedule a publish time (off = stay private)"
        type: boolean
        default: true

permissions:
  contents: write   # to commit new specs and published.json

concurrency: daily-short

jobs:
  short:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango1.0-dev pkg-config ffmpeg fonts-dejavu-core fonts-inter

      - run: pip install -r requirements.txt

      - name: Restore narration cache
        uses: actions/cache@v4
        with:
          path: tts_cache
          key: tts-${{ github.run_id }}
          restore-keys: tts-

      - name: Make the Short
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TTS_BACKEND: elevenlabs
          TTS_VOICE: ${{ vars.TTS_VOICE }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          SLUG: ${{ inputs.slug }}
          UPLOAD: ${{ github.event_name == 'schedule' || inputs.upload }}
          # Off until the repo variable PUBLISH_SCHEDULE is "on" (set it once Google's audit passes;
          # before that, API uploads are locked private and a publish time would never happen).
          SCHEDULE: ${{ vars.PUBLISH_SCHEDULE == 'on' && (github.event_name == 'schedule' || inputs.schedule) }}
        run: |
          FLAGS=""
          if [ "$UPLOAD" = "true" ]; then FLAGS="--upload"; fi
          if [ "$SCHEDULE" != "true" ]; then FLAGS="$FLAGS --no-schedule"; fi
          if [ -n "$SLUG" ]; then
            python pipeline.py run "$SLUG" $FLAGS
          else
            python pipeline.py next $FLAGS
          fi

      - name: Keep the video as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: out/*.mp4
          if-no-files-found: ignore

      - name: Commit specs and published.json
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add specs published.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "shorts: ${SLUG:-next} [skip ci]" && git push)
        env:
          SLUG: ${{ inputs.slug }}
