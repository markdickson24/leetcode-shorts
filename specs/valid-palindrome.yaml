approaches:
  - name: Two pointers
    template: two_pointers
    time: O(n)
    space: O(1)
    code: |
      def is_palindrome(s):
          l, r = 0, len(s) - 1
          while l < r:
              if not s[l].isalnum(): l += 1
              elif not s[r].isalnum(): r -= 1
              elif s[l].lower() != s[r].lower():
                  return False
              else: l, r = l + 1, r - 1
          return True
    traced_code: |
      def is_palindrome(s):
          l, r = 0, len(s) - 1
          skips = matches = 0
          while l < r:
              if not s[l].isalnum():
                  emit(l=l, r=r, line=2, label=f"'{s[l]}' isn't a letter", detail="skip it: L moves right")
                  l += 1
              elif not s[r].isalnum():
                  skips += 1
                  emit(l=l, r=r, line=3, label=f"'{s[r]}' isn't a letter", detail="skip it: R moves left",
                       say="Not a letter? Skip it." if skips == 1 else None)
                  r -= 1
              elif s[l].lower() != s[r].lower():
                  emit(l=l, r=r, line=5, label=f"'{s[l]}' ≠ '{s[r]}'", hit=False, result="return False")
                  return False
              else:
                  matches += 1
                  emit(l=l, r=r, line=6, label=f"'{s[l]}' == '{s[r]}'", detail="match: both move in",
                       say=f"{s[l].upper()} and {s[r]} match,\nso both pointers move in." if matches == 1 else None)
                  l, r = l + 1, r - 1
          emit(l=l, r=r, line=7, label="the pointers met", hit=True, result="return True")
          return True
