approaches:
- name: Brute force
  template: pairs_brute
  time: O(n²)
  space: O(1)
  code: |
    def two_sum(nums, target):
        n = len(nums)
        for i in range(n):
            for j in range(i + 1, n):
                if nums[i] + nums[j] == target:
                    return [i + 1, j + 1]
  traced_code: |
    def two_sum(nums, target):
        n = len(nums)
        checks = 0
        for i in range(n):
            for j in range(i + 1, n):
                checks += 1
                s = nums[i] + nums[j]
                emit(i=i, j=j, label=f"{nums[i]} + {nums[j]} = {s}", hit=s == target,
                     say_bg={1: "Ignore the sorting for now.\nJust try every pair...", 6: "...we're wasting the sorted order."}.get(checks))
                if s == target:
                    return [i + 1, j + 1]
  highlights:
    check: 3
    hit: 4
  intro: 'First idea: try every pair.'
  verdict: |-
    Works, but {steps} checks.
    That ignores the sorting.
  memory_label: seen
- name: Two pointers
  template: two_pointers
  time: O(n)
  space: O(1)
  code: |
    def two_sum(nums, target):
        l, r = 0, len(nums) - 1
        while l < r:
            s = nums[l] + nums[r]
            if s == target:
                return [l + 1, r + 1]
            if s < target:
                l += 1
            else:
                r -= 1
  traced_code: |
    def two_sum(nums, target):
        l, r = 0, len(nums) - 1
        emit(l=l, r=r, line=0, label="l = 0, r = end", say="Start with the smallest\nand the largest.")
        while l < r:
            s = nums[l] + nums[r]
            text = f"{nums[l]} + {nums[r]} = {s}"
            if s == target:
                emit(l=l, r=r, line=5, label=text, hit=True, result=f"return [{l + 1}, {r + 1}]", say=f"Exactly {target}!\nPositions {l + 1} and {r + 1}.")
                return [l + 1, r + 1]
            if s < target:
                emit(l=l, r=r, line=7, label=text, detail=f"{s} < {target}: too small, move l right", hit=False, say_bg="Too small? Only a bigger\nleft value can help.")
                l += 1
            else:
                emit(l=l, r=r, line=9 - 1, label=text, detail=f"{s} > {target}: too big, move r left", hit=False, say_bg="Too big? Drop the right\nvalue to something smaller.")
                r -= 1
  highlights: {}
  intro: |-
    Sorted means we can steer:
    small sum, big sum.
  verdict: |-
    One sweep. {steps} steps
    instead of {first_steps}.
  memory_label: seen
challenge: |-
