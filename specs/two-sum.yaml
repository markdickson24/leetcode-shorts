slug: two-sum
number: 1
title: Two Sum
function_name: two_sum
hook:
  top: Can't solve this?
  bottom: Start studying.
  spoken_top: If you can't solve this one...
  spoken_bottom: start studying.
statement: |-
  Find two numbers that add up
  to the target. Return their indices.
array_arg: nums
show_args: [target]
example:
  args: {nums: [3, 9, 5, 2, 8, 7], target: 15}
  expected: [4, 5]
tests:
  - {args: {nums: [3, 9, 5, 2, 8, 7], target: 15}, expected: [4, 5]}
  - {args: {nums: [2, 7, 11, 15], target: 9}, expected: [0, 1]}
  - {args: {nums: [3, 2, 4], target: 6}, expected: [1, 2]}
  - {args: {nums: [3, 3], target: 6}, expected: [0, 1]}
  - {args: {nums: [-1, -2, -3, -4, -5], target: -8}, expected: [2, 4]}
  - {args: {nums: [0, 4, 3, 0], target: 0}, expected: [0, 3]}
compare: sorted
approaches:
  - name: Brute force
    template: pairs_brute
    time: O(n²)
    space: O(1)
    code: |
      def two_sum(nums, target):
          n = len(nums)
          for i in range(n):
              for j in range(i + 1, n):
                  if nums[i] + nums[j] == target:
                      return [i, j]
    traced_code: |
      def two_sum(nums, target):
          n = len(nums)
          checks = 0
          for i in range(n):
              for j in range(i + 1, n):
                  checks += 1
                  s = nums[i] + nums[j]
                  emit(i=i, j=j, label=f"{nums[i]} + {nums[j]} = {s}", hit=s == target,
                       say_bg={3: "Check it, move on,\ncheck the next pair...",
                               9: "...this gets slow fast."}.get(checks))
                  if s == target:
                      return [i, j]
    highlights: {check: 3, hit: 4}
    intro: 'Easiest idea: try every pair.'
    verdict: |-
      Found it, but only after
      {steps} checks. That's O(n²).
  - name: HashMap
    template: hashmap_scan
    time: O(n)
    space: O(n)
    memory_label: seen
    code: |
      def two_sum(nums, target):
          seen = {}
          for i, x in enumerate(nums):
              need = target - x
              if need in seen:
                  return [seen[need], i]
              seen[x] = i
    traced_code: |
      def two_sum(nums, target):
          seen = {}
          for i, x in enumerate(nums):
              need = target - x
              ev = dict(i=i, label=f"need = {target} − {x} = {need}",
                        query=f"{need} in seen?", found=need in seen)
              if need in seen:
                  j = seen[need]
                  emit(**ev, match=j, result=f"return [{j}, {i}]",
                       say=f"{x} needs {need}, and we already\nsaw {need} at index {j}!")
                  return [j, i]
              if i == 0:
                  ev["say"] = f"{x} needs {need}. Not seen yet,\nso store {x} → index {i}."
              emit(**ev, store=f"{x}→{i}")
              seen[x] = i
    highlights: {init: 0, compute: 2, lookup: 3, found: 4, store: 5}
    intro: |-
      For each number, ask:
      have I seen its partner yet?
    verdict: One pass. {steps} steps instead of {first_steps}.
challenge: |-
  Pause. Can you do it
  in ONE pass?
outro:
  - Interviewers want the O(n) one.
  - |-
    Could you solve it?
    Drop your time in the comments.
