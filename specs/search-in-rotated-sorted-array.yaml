slug: search-in-rotated-sorted-array
number: 33
title: Search in Rotated Sorted Array
function_name: search
hook:
  top: Sorted, then rotated.
  bottom: Still 3 looks.
  spoken_top: Sorted, then rotated...
  spoken_bottom: and binary search still finds it in three looks.
statement: |-
  A sorted list was rotated. Find the
  target's index, or −1 if it isn't there.
array_arg: nums
show_args: [target]
example:
  args: {nums: [9, 12, 15, 1, 2, 4, 6, 7], target: 15}
  expected: 2
tests:
  - {args: {nums: [9, 12, 15, 1, 2, 4, 6, 7], target: 15}, expected: 2}
  - {args: {nums: [9, 12, 15, 1, 2, 4, 6, 7], target: 6}, expected: 6}
  - {args: {nums: [9, 12, 15, 1, 2, 4, 6, 7], target: 10}, expected: -1}
  - {args: {nums: [4, 5, 6, 7, 0, 1, 2], target: 0}, expected: 4}
  - {args: {nums: [4, 5, 6, 7, 0, 1, 2], target: 3}, expected: -1}
  - {args: {nums: [1], target: 0}, expected: -1}
  - {args: {nums: [1], target: 1}, expected: 0}
  - {args: {nums: [1, 3], target: 3}, expected: 1}
  - {args: {nums: [3, 1], target: 1}, expected: 1}
  - {args: {nums: [5, 1, 3], target: 5}, expected: 0}
  - {args: {nums: [5, 1, 3], target: 3}, expected: 2}
  - {args: {nums: [1, 2, 3, 4, 5], target: 4}, expected: 3}
approaches:
  - name: Binary search
    template: binary_search
    time: O(log n)
    space: O(1)
    code: |
      def search(nums, target):
          l, r = 0, len(nums) - 1
          while l <= r:
              m = (l + r) // 2
              if nums[m] == target: return m
              if nums[l] <= nums[m]:
                  if nums[l] <= target < nums[m]:
                      r = m - 1
                  else: l = m + 1
              elif nums[m] < target <= nums[r]:
                  l = m + 1
              else: r = m - 1
          return -1
    traced_code: |
      def search(nums, target):
          l, r = 0, len(nums) - 1
          looks = 0
          while l <= r:
              m = (l + r) // 2
              looks += 1
              if nums[m] == target:
                  emit(l=l, r=r, m=m, line=3, label=f"nums[{m}] = {nums[m]}", hit=True,
                       result=f"return {m}", say=f"Look number {looks}. Found it.")
                  return m
              if nums[l] <= nums[m]:
                  span = f"{nums[l]}…{nums[m]} is sorted"
                  if nums[l] <= target < nums[m]:
                      emit(l=l, r=r, m=m, line=6, label=span, detail=f"{target} is in it: R = M − 1")
                      r = m - 1
                  else:
                      emit(l=l, r=r, m=m, line=7, label=span, detail=f"{target} isn't in it: L = M + 1",
                           say="The left half is sorted,\nand it can't hold the target." if looks == 1 else None)
                      l = m + 1
              else:
                  span = f"{nums[m]}…{nums[r]} is sorted"
                  if nums[m] < target <= nums[r]:
                      emit(l=l, r=r, m=m, line=9, label=span, detail=f"{target} is in it: L = M + 1")
                      l = m + 1
                  else:
                      emit(l=l, r=r, m=m, line=10, label=span, detail=f"{target} isn't in it: R = M − 1",
                           say="The right half is sorted,\nand it can't hold the target." if looks == 1 else None)
                      r = m - 1
          emit(l=l, r=r, m=min(max(r, 0), len(nums) - 1), line=11, label="range is empty", result="return -1")
          return -1
    highlights: {}
    intro: |-
      One half is always sorted.
      Check if the target lives there.
    verdict: |-
      {steps} looks instead of up to 8.
      The rotation costs nothing.
challenge: ""
outro:
  - |-
    One sorted half every step,
    so it's still O(log n).
  - |-
    What if there were duplicates?
    Tell me in the comments.
